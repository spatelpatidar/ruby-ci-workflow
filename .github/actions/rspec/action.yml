name: Set up Ruby and run RSpec
description: Installs Ruby and gems (with caching) and runs the spec suite.

inputs:
  ruby-version:
    description: Ruby version to use
    required: true

runs:
  using: composite
  steps:
    - name: Set up Ruby ${{ inputs.ruby-version }}
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true

    - name: Run RSpec
      shell: bash
      run: bundle exec rspec --format progress