name: Ruby CI (reusable)

# Called from a project repo:
#   uses: spatelpatidar/ruby-ci-workflow/.github/workflows/ci.yml@v1
# Each project keeps its own sonar-project.properties.
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  # ── Linux: every Ruby version, one after another ──────────────────────────
  linux-ruby-3-2:
    name: Linux · Ruby 3.2
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec rspec --format progress

  linux-ruby-3-3:
    name: Linux · Ruby 3.3
    needs: linux-ruby-3-2
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rspec --format progress

  linux-ruby-3-4:
    name: Linux · Ruby 3.4
    needs: linux-ruby-3-3
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec --format progress

  # ── Windows and macOS: start after Linux passes, run side by side ─────────
  windows-ruby-3-4:
    name: Windows · Ruby 3.4
    needs: linux-ruby-3-4
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec --format progress

  macos-ruby-3-4:
    name: macOS · Ruby 3.4
    needs: linux-ruby-3-4
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec --format progress

  # ── Build, analysis, final gate ───────────────────────────────────────────
  build:
    name: Build gem
    needs: [windows-ruby-3-4, macos-ruby-3-4]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Build gem (checks the gemspec and file list)
        run: |
          shopt -s nullglob
          specs=(*.gemspec)
          if [ "${#specs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .gemspec in the repo root, found ${#specs[@]}: ${specs[*]}"
            exit 1
          fi
          gem build "${specs[0]}"
          ruby -rrubygems/package -e 'puts Gem::Package.new(Dir["*.gem"].first).contents.sort'

  sonar:
    name: SonarQube analysis
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Run specs to produce coverage
        run: bundle exec rspec --format progress
      # Reads sonar-project.properties from the CALLER repo (project key, exclusions, ...)
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  # Caller job is named "ci", so the required check shows up as "ci / CI passed"
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - linux-ruby-3-2
      - linux-ruby-3-3
      - linux-ruby-3-4
      - windows-ruby-3-4
      - macos-ruby-3-4
      - build
      - sonar
    runs-on: ubuntu-26.04
    steps:
      - name: Fail if any job failed, was skipped or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "One or more jobs did not succeed"
          exit 1
      - name: All jobs passed
        run: echo "All jobs passed"
